name: Run Python Client

# Thiết lập thời điểm chạy tự động (Trigger)
on:
  # 1. Chạy thủ công từ giao diện GitHub (tab Actions)
  workflow_dispatch:
  
  # 2. Chạy theo lịch trình (Ví dụ: Chạy vào lúc 0:00 hàng ngày UTC)
  schedule:
    - cron: '0 0 * * *'
    
  # 3. Chạy mỗi khi có lệnh push code mới lên nhánh main
  push:
    branches: [ "main" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest # Chạy trên máy ảo hệ điều hành Ubuntu

    steps:
    # Bước 1: Tải mã nguồn từ repository về máy ảo
    - name: Checkout code
      uses: actions/checkout@v4

    # Bước 2: Cài đặt môi trường Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Phiên bản Python bạn muốn sử dụng

    # Bước 3: Cài đặt các thư viện phụ thuộc (nếu project có file requirements.txt)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Bước 4: Chạy file Python chính (đảm bảo repository của bạn có file main.py)
    - name: Run Python script
      run: |
        python main.py
